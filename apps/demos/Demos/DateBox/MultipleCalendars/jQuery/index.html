<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
  <head>
    <title>DevExtreme Demo</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <script src="../../../../node_modules/jquery/dist/jquery.min.js"></script>
    <link rel="stylesheet" type="text/css" href="../../../../node_modules/devextreme-dist/css/dx.light.css" />
    <link rel="stylesheet" type="text/css" href="styles.css" />
    <script src="../../../../node_modules/devextreme-dist/js/dx.all.js"></script>
    <script src="index.js"></script>
  </head>
  <body class="dx-viewport">
    <div class="demo-container">
      <div class="dx-fieldset">
        <div class="dx-field">
          <div class="dx-field-label">Calendar</div>
          <div class="dx-field-value">
            <div id="calendar-selector"></div>
          </div>
        </div>
        <div class="dx-field">
          <div class="dx-field-label">Rollers picker</div>
          <div class="dx-field-value">
            <div id="rollers"></div>
          </div>
        </div>
        <div class="dx-field">
          <div class="dx-field-label">Calendar grid picker</div>
          <div class="dx-field-value">
            <div id="calendar-picker"></div>
          </div>
        </div>
        <div class="dx-field">
          <div class="dx-field-label">Typed input (mask)</div>
          <div class="dx-field-value">
            <div id="mask"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
