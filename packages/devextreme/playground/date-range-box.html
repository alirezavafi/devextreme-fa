<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="dateRangeBox.title">DateRangeBox · DevExtreme multi-calendar</title>
    <script type="module" src="./pages/date-range-box/index.ts"></script>
</head>
<body class="dx-viewport">
<main class="db-main db-container">
    <div class="db-hero">
        <div class="db-hero__title" data-i18n="nav.dateRangeBox"></div>
        <p class="db-hero__lede" data-i18n="dateRangeBox.lede"></p>
        <div class="db-hero__chips"><span class="db-chip">dxDateRangeBox</span><span class="db-chip">value</span><span class="db-chip">multiView</span><span class="db-chip">applyValueMode</span></div>
    </div>

    <div class="db-section-label" data-i18n="section.live"></div>
    <div class="db-live">
        <div class="db-stack">
            <section class="db-card">
                <div class="db-card__head"><span class="db-card__title" data-i18n="card.widget"></span></div>
                <div class="db-widget-stage"><div id="daterangebox"></div></div>
            </section>
            <section data-db-log></section>
            <section class="db-card">
                <div class="db-card__head"><span class="db-card__title" data-i18n="card.options"></span><span class="db-card__hint" data-i18n="card.optionsHint"></span></div>
                <div id="options"></div>
            </section>
        </div>
        <div class="db-stack">
            <section class="db-card">
                <div class="db-card__head"><span class="db-card__title" data-i18n="card.inspector"></span></div>
                <div class="db-card__body--flush" id="inspector"></div>
            </section>
            <section class="db-card">
                <div class="db-card__head"><span class="db-card__title" data-i18n="card.actions"></span></div>
                <div class="db-card__body db-actions" id="actions"></div>
            </section>
        </div>
    </div>
</main>
</body>
</html>
