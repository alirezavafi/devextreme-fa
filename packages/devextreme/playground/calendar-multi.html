<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="all.title">All widgets · DevExtreme multi-calendar</title>
    <script type="module" src="./calendar-multi.ts"></script>
</head>
<body class="dx-viewport">
<main class="db-main db-container">
    <div class="db-hero">
        <div class="db-hero__title" data-i18n="nav.all"></div>
        <p class="db-hero__lede" data-i18n="all.lede"></p>
        <div class="db-hero__chips"><span class="db-chip">dxDateBox</span><span class="db-chip">dxDateRangeBox</span><span class="db-chip">dxCalendar</span><span class="db-chip">dxDataGrid</span><span class="db-chip">dxScheduler</span><span class="db-chip">dxPivotGrid</span></div>
    </div>

    <div class="db-section-label" data-i18n="section.live"></div>
    <div class="db-live">
        <div class="db-stack">
            <div class="db-two" style="margin-top: 0">
                <section class="db-card">
                    <div class="db-card__head"><span class="db-card__title" data-i18n="all.card.dateBoxRollers"></span></div>
                    <div class="db-widget-stage"><div id="datebox-rollers"></div></div>
                    <div class="db-card__body--flush" data-readout-for="#datebox-rollers"></div>
                </section>
                <section class="db-card">
                    <div class="db-card__head"><span class="db-card__title" data-i18n="all.card.dateBoxCalendar"></span></div>
                    <div class="db-widget-stage"><div id="datebox-calendar"></div></div>
                    <div class="db-card__body--flush" data-readout-for="#datebox-calendar"></div>
                </section>
                <section class="db-card">
                    <div class="db-card__head"><span class="db-card__title" data-i18n="all.card.dateBoxMask"></span></div>
                    <div class="db-widget-stage"><div id="datebox-mask"></div></div>
                    <div class="db-card__body--flush" data-readout-for="#datebox-mask"></div>
                </section>
                <section class="db-card">
                    <div class="db-card__head"><span class="db-card__title" data-i18n="all.card.dateBoxDatetime"></span></div>
                    <div class="db-widget-stage"><div id="datebox-datetime"></div></div>
                    <div class="db-card__body--flush" data-readout-for="#datebox-datetime"></div>
                </section>
                <section class="db-card">
                    <div class="db-card__head"><span class="db-card__title" data-i18n="all.card.dateBoxDatetimeMask"></span></div>
                    <div class="db-widget-stage"><div id="datebox-datetime-mask"></div></div>
                    <div class="db-card__body--flush" data-readout-for="#datebox-datetime-mask"></div>
                </section>
                <section class="db-card">
                    <div class="db-card__head"><span class="db-card__title" data-i18n="all.card.dateRangeBox"></span></div>
                    <div class="db-widget-stage"><div id="daterangebox"></div></div>
                    <div class="db-card__body--flush" data-readout-for="#daterangebox"></div>
                </section>
            </div>
            <section class="db-card">
                <div class="db-card__head"><span class="db-card__title" data-i18n="all.card.calendar"></span></div>
                <div class="db-widget-stage"><div id="calendar"></div></div>
                <div class="db-card__body--flush" data-readout-for="#calendar"></div>
            </section>
        </div>
        <div class="db-stack">
            <section class="db-card">
                <div class="db-card__head"><span class="db-card__title" data-i18n="card.actions"></span></div>
                <div class="db-card__body db-actions" id="actions"></div>
            </section>
            <section data-db-log></section>
        </div>
    </div>

    <div class="db-wide">
        <section class="db-card">
            <div class="db-card__head"><span class="db-card__title" data-i18n="all.card.dataGrid"></span></div>
            <div class="db-card__body"><div id="datagrid"></div></div>
        </section>
    </div>
    <div class="db-wide">
        <section class="db-card">
            <div class="db-card__head"><span class="db-card__title" data-i18n="all.card.scheduler"></span></div>
            <div class="db-card__body"><div id="scheduler"></div></div>
        </section>
    </div>
    <div class="db-wide">
        <section class="db-card">
            <div class="db-card__head"><span class="db-card__title" data-i18n="all.card.pivotGrid"></span></div>
            <div class="db-card__body"><div id="pivotgrid"></div></div>
        </section>
    </div>
</main>
</body>
</html>
