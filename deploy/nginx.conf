# The showcase used to live at demos.dev-box.ir/devextreme-fa/. The host nginx
# forwards Host unchanged, so old links land here and move to the new domain.
server {
    listen 80;
    server_name demos.dev-box.ir;

    location ~ ^/devextreme-fa/?(.*)$ {
        return 301 https://devextreme.dev-box.ir/$1$is_args$args;
    }

    location / {
        return 301 https://devextreme.dev-box.ir$request_uri;
    }
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index showcase.html index.html;

    # The container only sees plain HTTP behind the host's TLS, so nginx's own
    # directory redirects (/demos -> /demos/) must stay relative.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    # The React/Vue demo-suite pages were replaced by the pages above; send old
    # links to the page for the same widget.
    location ~ ^/demos/Demos/Calendar/ { return 301 /calendar.html; }
    location ~ ^/demos/Demos/DateBox/ { return 301 /date-box.html; }
    location ~ ^/demos/Demos/DateRangeBox/ { return 301 /date-range-box.html; }
    location ~ ^/demos/Demos/DataGrid/ { return 301 /data-grid.html; }
    location ~ ^/demos/Demos/Scheduler/ { return 301 /scheduler.html; }
    location ~ ^/demos(/|$) { return 301 /; }

    # The playground bundles the library from source, so the entry chunks are
    # ~1 MB each and compress to roughly a third of that.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Hashed filenames change every build; the HTML entry points must not stick.
    location ~* \.(js|css|woff2?|ttf|png|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }
}
