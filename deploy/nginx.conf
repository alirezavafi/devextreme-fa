server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index showcase.html index.html;

    # Everything is published under a sub-path, so the bare host lands there too.
    location = / {
        return 302 /devextreme-fa/;
    }

    location /devextreme-fa/ {
        try_files $uri $uri/ =404;
    }

    # The playground bundles the library from source, so the entry chunks are
    # ~1 MB each and compress to roughly a third of that.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Hashed filenames change every build; the HTML entry points must not stick.
    location ~* \.(js|css|woff2?|ttf|png|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }
}
